schemaVersion: 1

project:
  id: setuhaul
  name: SetuHaul
  repository:
    type: git
    mainBranch: main

# "Build latest, then deploy" runs the fast pipeline, so fast runs every check too.
# "py" is the Windows launcher: where ForgeCI runs on macOS or Linux, use "python3.12 scripts/ci.py".
pipelines:
  fast:
    description: "Lint, types and tests"
    command: py -3.12 scripts/ci.py
    timeout: 900
  full:
    description: "Lint, types and tests"
    command: py -3.12 scripts/ci.py
    timeout: 900

results:
  directory: .engineering/results

quality:
  tests:
    required: true
    allowFailures: 0
