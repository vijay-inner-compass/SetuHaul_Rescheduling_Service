<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img">
<title>Two drivers racing for one slot</title><desc>Both requests queue on a write lock, the slot is re-checked, and a unique index lets only the first insert succeed.</desc>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="480" fill="#FFFFFF"/>
<rect x="100" y="30" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="175.0" y="54.0" text-anchor="middle" dominant-baseline="central" style="fill:#444441">Driver A picks 1</text>
<rect x="430" y="30" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="505.0" y="54.0" text-anchor="middle" dominant-baseline="central" style="fill:#444441">Driver B picks 1</text>
<line class="arr" x1="175" y1="78" x2="175" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="505" y1="78" x2="505" y2="118" marker-end="url(#arrow)"/>
<rect x="100" y="120" width="480" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="340.0" y="140" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">Write lock (BEGIN IMMEDIATE)</text><text class="ts" x="340.0" y="154" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">requests queue, one at a time</text>
<line class="arr" x1="340" y1="172" x2="340" y2="208" marker-end="url(#arrow)"/>
<rect x="190" y="210" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="340.0" y="230" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Re-check the slot</text><text class="ts" x="340.0" y="248" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">fresh snapshot and GPS floor</text>
<line class="arr" x1="340" y1="266" x2="340" y2="302" marker-end="url(#arrow)"/>
<rect x="190" y="304" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="th" x="340.0" y="324" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">Insert HELD row</text><text class="ts" x="340.0" y="342" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">unique index: one active row per slot</text>
<line class="arr" x1="270" y1="360" x2="200" y2="398" marker-end="url(#arrow)"/>
<line class="arr" x1="410" y1="360" x2="480" y2="398" marker-end="url(#arrow)"/>
<rect x="80" y="400" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="200.0" y="420" text-anchor="middle" dominant-baseline="central" style="fill:#085041">First commit: HELD</text><text class="ts" x="200.0" y="438" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">180 s to confirm</text>
<rect x="360" y="400" width="240" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text class="th" x="480.0" y="420" text-anchor="middle" dominant-baseline="central" style="fill:#791F1F">Second: SLOT_CONFLICT</text><text class="ts" x="480.0" y="438" text-anchor="middle" dominant-baseline="central" style="fill:#A32D2D">offered the next option</text>
</svg>
