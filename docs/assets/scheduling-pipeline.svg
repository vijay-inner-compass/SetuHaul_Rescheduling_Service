<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img">
<title>Scheduling pipeline</title><desc>Eight stages from ETA derivation to confirmation, split into read-only steps and steps that change capacity.</desc>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="330" fill="#FFFFFF"/>
<text class="ts" x="44" y="30" text-anchor="start">Read-only: any number of drivers at once</text>
<rect x="44" y="44" width="136" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="112.0" y="64" text-anchor="middle" dominant-baseline="central" style="fill:#085041">ETA</text><text class="ts" x="112.0" y="90" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">derive_eta</text>
<line class="arr" x1="180" y1="76" x2="194" y2="76" marker-end="url(#arrow)"/>
<rect x="196" y="44" width="136" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="264.0" y="64" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Snapshot</text><text class="ts" x="264.0" y="90" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">facility state</text>
<line class="arr" x1="332" y1="76" x2="346" y2="76" marker-end="url(#arrow)"/>
<rect x="348" y="44" width="136" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="416.0" y="64" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Judge slots</text><text class="ts" x="416.0" y="90" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">evaluate_slot</text>
<line class="arr" x1="484" y1="76" x2="498" y2="76" marker-end="url(#arrow)"/>
<rect x="500" y="44" width="136" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="568.0" y="64" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Rank top 3</text><text class="ts" x="568.0" y="90" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">rank_options</text>
<path class="arr" d="M568 108 L568 150 L112 150 L112 186" marker-end="url(#arrow)"/>
<text class="ts" x="44" y="176" text-anchor="start">Shown to the driver, then claimed</text>
<rect x="44" y="190" width="136" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="112.0" y="210" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Menu</text><text class="ts" x="112.0" y="236" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">valid 15 min</text>
<line class="arr" x1="180" y1="222" x2="194" y2="222" marker-end="url(#arrow)"/>
<rect x="196" y="190" width="136" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="th" x="264.0" y="210" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">Hold</text><text class="ts" x="264.0" y="236" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">180 s, first wins</text>
<line class="arr" x1="332" y1="222" x2="346" y2="222" marker-end="url(#arrow)"/>
<rect x="348" y="190" width="136" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="th" x="416.0" y="210" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">Confirm</text><text class="ts" x="416.0" y="236" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D">one transaction</text>
<rect x="500" y="190" width="136" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="568.0" y="210" text-anchor="middle" dominant-baseline="central" style="fill:#444441">Truck moves</text><text class="ts" x="568.0" y="236" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">GPS re-check</text>
<rect x="44" y="282" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="66" y="290" dominant-baseline="central">No capacity change</text>
<rect x="230" y="282" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="252" y="290" dominant-baseline="central">Changes capacity, re-checks inside the lock</text>
</svg>
