<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img">
<title>How one slot gets a verdict</title><desc>Five checks in fixed order; each failure exits to infeasible, incomplete data or approval needed. A slot that passes all is feasible.</desc>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="490" fill="#FFFFFF"/>
<rect x="40" y="30" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="185.0" y="50" text-anchor="middle" dominant-baseline="central" style="fill:#444441">1. Snapshot fresh?</text><text class="ts" x="185.0" y="64" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">under 5 minutes old</text>
<line class="arr" x1="330" y1="56" x2="418" y2="56" marker-end="url(#arrow)"/>
<rect x="420" y="30" width="220" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="th" x="530.0" y="50" text-anchor="middle" dominant-baseline="central" style="fill:#633806">INCOMPLETE data</text><text class="ts" x="530.0" y="64" text-anchor="middle" dominant-baseline="central" style="fill:#854F0B">stale state, not guessed</text>
<line class="arr" x1="185" y1="82" x2="185" y2="106" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="98" text-anchor="start">pass</text>
<rect x="40" y="108" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="185.0" y="128" text-anchor="middle" dominant-baseline="central" style="fill:#444441">2. No hard rule broken?</text><text class="ts" x="185.0" y="142" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">dock, hours, load, timing</text>
<line class="arr" x1="330" y1="134" x2="418" y2="134" marker-end="url(#arrow)"/>
<rect x="420" y="108" width="220" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text class="th" x="530.0" y="128" text-anchor="middle" dominant-baseline="central" style="fill:#791F1F">INFEASIBLE</text><text class="ts" x="530.0" y="142" text-anchor="middle" dominant-baseline="central" style="fill:#A32D2D">every reason listed</text>
<line class="arr" x1="185" y1="160" x2="185" y2="184" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="176" text-anchor="start">pass</text>
<rect x="40" y="186" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="185.0" y="206" text-anchor="middle" dominant-baseline="central" style="fill:#444441">3. Evidence present?</text><text class="ts" x="185.0" y="220" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">labour rows, consignee row</text>
<line class="arr" x1="330" y1="212" x2="418" y2="212" marker-end="url(#arrow)"/>
<rect x="420" y="186" width="220" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="th" x="530.0" y="206" text-anchor="middle" dominant-baseline="central" style="fill:#633806">INCOMPLETE data</text><text class="ts" x="530.0" y="220" text-anchor="middle" dominant-baseline="central" style="fill:#854F0B">missing, never assumed</text>
<line class="arr" x1="185" y1="238" x2="185" y2="262" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="254" text-anchor="start">pass</text>
<rect x="40" y="264" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="185.0" y="284" text-anchor="middle" dominant-baseline="central" style="fill:#444441">4. Labour covers the slot?</text><text class="ts" x="185.0" y="298" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">crews and equipment</text>
<line class="arr" x1="330" y1="290" x2="418" y2="290" marker-end="url(#arrow)"/>
<rect x="420" y="264" width="220" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text class="th" x="530.0" y="284" text-anchor="middle" dominant-baseline="central" style="fill:#791F1F">INFEASIBLE</text><text class="ts" x="530.0" y="298" text-anchor="middle" dominant-baseline="central" style="fill:#A32D2D">labour or equipment short</text>
<line class="arr" x1="185" y1="316" x2="185" y2="340" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="332" text-anchor="start">pass</text>
<rect x="40" y="342" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="185.0" y="362" text-anchor="middle" dominant-baseline="central" style="fill:#444441">5. Consignee deadline met?</text><text class="ts" x="185.0" y="376" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A">or no penalty applies</text>
<line class="arr" x1="330" y1="368" x2="418" y2="368" marker-end="url(#arrow)"/>
<rect x="420" y="342" width="220" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="th" x="530.0" y="362" text-anchor="middle" dominant-baseline="central" style="fill:#633806">REQUIRES APPROVAL</text><text class="ts" x="530.0" y="376" text-anchor="middle" dominant-baseline="central" style="fill:#854F0B">penalty or exceptional</text>
<line class="arr" x1="185" y1="394" x2="185" y2="418" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="410" text-anchor="start">pass</text>
<text class="ts" x="374" y="48" text-anchor="middle">fail</text>
<rect x="40" y="420" width="290" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="185.0" y="442.0" text-anchor="middle" dominant-baseline="central" style="fill:#085041">FEASIBLE: can be offered</text>
</svg>
